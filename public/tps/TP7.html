<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP7 — Calculatrice JS | Portfolio BTS SIO</title>
    <link rel="stylesheet" href="./tp-style.css">
</head>
<body>

<header class="tp-header">
    <a href="../../" class="back">← Retour au portfolio</a>
    <span class="breadcrumb">Projets Scolaires / <span>TP7 — Calculatrice JS</span></span>
</header>

<div class="tp-wrapper">
    <div class="tp-title">
        <div class="tag">TP7 · 2024</div>
        <h1>Calculatrice JavaScript</h1>
        <p>Première interface interactive en JS : opérations arithmétiques, test de parité et permutation de valeurs.</p>
    </div>

    <div class="card">
        <h2>Calculatrice</h2>

        <div class="grid-2">
            <div>
                <label>Nombre 1</label>
                <input type="number" id="t1" placeholder="ex: 12">
            </div>
            <div>
                <label>Nombre 2</label>
                <input type="number" id="t2" placeholder="ex: 4">
            </div>
        </div>

        <div class="btn-row" style="margin-bottom: 20px;">
            <button class="btn" onclick="somme()">+ Addition</button>
            <button class="btn btn-secondary" onclick="soustraction()">− Soustraction</button>
            <button class="btn btn-secondary" onclick="multiplication()">× Multiplication</button>
            <button class="btn btn-secondary" onclick="division()">÷ Division</button>
        </div>

        <div class="grid-2">
            <div>
                <label>Résultat</label>
                <input type="text" id="t3" placeholder="---" readonly>
            </div>
            <div>
                <label>Parité du résultat</label>
                <input type="text" id="pair" placeholder="---" readonly>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-outline" onclick="testPair()">Tester la parité</button>
            <button class="btn btn-outline" onclick="permuter()">⇄ Permuter les valeurs</button>
            <button class="btn btn-outline" onclick="clearAll()">✕ Effacer tout</button>
        </div>

        <div id="msg" class="alert" style="margin-top: 16px;"></div>
    </div>

    <div class="card">
        <h2>Technologies utilisées</h2>
        <span class="tech-tag">HTML</span>
        <span class="tech-tag">CSS</span>
        <span class="tech-tag">JavaScript</span>
        <span class="tech-tag">Manipulation DOM</span>
    </div>
</div>

<script>
function getVals() {
    var a = parseFloat(document.getElementById('t1').value);
    var b = parseFloat(document.getElementById('t2').value);
    return { a: a, b: b };
}

function setResult(val) {
    document.getElementById('t3').value = val;
    document.getElementById('pair').value = '';
}

function showMsg(txt, type) {
    var el = document.getElementById('msg');
    el.textContent = txt;
    el.className = 'alert show ' + type;
    setTimeout(function() { el.className = 'alert'; }, 2500);
}

function somme() {
    var v = getVals();
    if (isNaN(v.a) || isNaN(v.b)) { showMsg('Saisir deux nombres valides.', 'error'); return; }
    setResult(v.a + v.b);
}

function soustraction() {
    var v = getVals();
    if (isNaN(v.a) || isNaN(v.b)) { showMsg('Saisir deux nombres valides.', 'error'); return; }
    setResult(v.a - v.b);
}

function multiplication() {
    var v = getVals();
    if (isNaN(v.a) || isNaN(v.b)) { showMsg('Saisir deux nombres valides.', 'error'); return; }
    setResult(v.a * v.b);
}

function division() {
    var v = getVals();
    if (isNaN(v.a) || isNaN(v.b)) { showMsg('Saisir deux nombres valides.', 'error'); return; }
    if (v.b === 0) { showMsg('Division par zéro impossible.', 'error'); return; }
    setResult(v.a / v.b);
}

function testPair() {
    var res = parseFloat(document.getElementById('t3').value);
    if (isNaN(res)) { showMsg('Effectuez une opération d\'abord.', 'error'); return; }
    document.getElementById('pair').value = (res % 2 === 0) ? 'Pair' : 'Impair';
}

function permuter() {
    var t1 = document.getElementById('t1');
    var t2 = document.getElementById('t2');
    var tmp = t1.value;
    t1.value = t2.value;
    t2.value = tmp;
    showMsg('Valeurs permutées.', 'info');
}

function clearAll() {
    document.getElementById('t1').value = '';
    document.getElementById('t2').value = '';
    document.getElementById('t3').value = '';
    document.getElementById('pair').value = '';
}
</script>

</body>
</html>
